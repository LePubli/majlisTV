# Majlis TV - étape 1A : base de données + API
# Compatible DockPanel (reverse proxy vers 127.0.0.1:3000), Coolify et Ubuntu 24.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-majlis}
      POSTGRES_USER: ${POSTGRES_USER:-majlis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-Majlis TV}
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-majlis}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-majlis}
      JWT_SECRET: ${JWT_SECRET:?Définir JWT_SECRET}
      JWT_EXPIRES: ${JWT_EXPIRES:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
